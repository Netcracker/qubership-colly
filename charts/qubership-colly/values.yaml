---
CLOUD_PUBLIC_HOST: fff
NAMESPACE: qubership-colly
MANAGED_BY: Helm
# M2M authentication mode (PDPLDEVOPS-25309): legacy (default, current
# Keycloak client-credentials behavior) | hybrid (k8s SA token with fallback
# to Keycloak) | k8s (k8s SA token only). hybrid/k8s require the platform's
# ServiceAccount token volumes rendered by the deployment templates and the
# platform `topology` ConfigMap present in the namespace (mounted read-only
# at /etc/topology; without it hybrid/k8s pods fail to start).
# Any other value makes helm template fail.
M2M_AUTH_MODE: legacy
# Lifetime of the projected ServiceAccount tokens in seconds (platform coretpl
# convention; the deployment template falls back to 3600 when unset). Keep it
# within the cluster's max ServiceAccount token expiration (the TokenRequest
# setting on the API server).
KUBERNETES_M2M_EXPIRATION_SECONDS: 3600
colly:
  global:
  envgeneInventoryService:
    image: ghcr.io/netcracker/envgene-inventory-service:latest
    serviceName: envgene-inventory-service
    projectRepoUrl:
    projectRepoGitToken: fff
    gitTokens: [ ]
    # gitTokens:
    #   - region: cn
    #     token: ghp_token_for_cn
    #   - region: mb
    #     token: ghp_token_for_mb
    cronSchedule: 0 0/2 * * * ?
    cloudCoreSupport: false
    idp:
      url:
      clientId: envgene-inventory-service
      clientSecret:
    redis:
      hosts: redis://redis:6379
      username: ""
      password: ""
    ports:
      http: 8080
  environmentOperationalService:
    image: ghcr.io/netcracker/environment-operational-service:latest
    serviceName: environment-operational-service
    cronSchedule: 0 0/1 * * * ?
    idp:
      url:
      clientId: environment-operational-service
      clientSecret:
    redis:
      hosts: redis://redis:6379
      username: ""
      password: ""
    sdPatterns:
      product: "(?i)product"
      project: "(?i)project"
    ports:
      http: 8080
    monitoring:
      - key: running-pods
        name: Running Pods
        query: count(kube_pod_status_phase{namespace=~"{namespace}",phase="Running"})
      - key: failed-deployments
        name: Failed Deployments
        query: count(kube_deployment_status_replicas_unavailable{namespace=~"{namespace}"})
  uiService:
    image: ghcr.io/netcracker/ui-service:latest
    serviceName: ui-service
    uiEnabled: false
    idp:
      url:
      clientId: ui-service
    ports:
      http: 8080
    ingress:
      className: alb
      http:
        annotations:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
