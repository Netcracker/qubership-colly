---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: {{ .Values.colly.environmentOperationalService.serviceName }}
    app.kubernetes.io/name: {{ .Values.colly.environmentOperationalService.serviceName }}
    app.kubernetes.io/instance: {{ printf "%s-%s" .Values.colly.environmentOperationalService.serviceName .Values.NAMESPACE }}
    app.kubernetes.io/version: {{ .Chart.Version }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: qubership-colly
    app.kubernetes.io/managed-by: {{ .Values.MANAGED_BY }}
    app.kubernetes.io/technology: java
  name: {{ .Values.colly.environmentOperationalService.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: {{ .Values.colly.environmentOperationalService.serviceName }}
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.27.2
      labels:
        name: {{ .Values.colly.environmentOperationalService.serviceName }}
        app.kubernetes.io/name: {{ .Values.colly.environmentOperationalService.serviceName }}
        app.kubernetes.io/instance: {{ printf "%s-%s" .Values.colly.environmentOperationalService.serviceName .Values.NAMESPACE }}
        app.kubernetes.io/version: {{ .Chart.Version }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: qubership-colly
        app.kubernetes.io/technology: java
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_REDIS_HOSTS
              value: {{ .Values.colly.environmentOperationalService.redis.hosts }}
            # Authenticators are NOT environment variables (BASS Authenticators
            # Handling Guide, req #4: env vars with secrets are prohibited).
            # They are mounted as files from the k8s Secrets below; the app's
            # secret-files config source exposes each file as the config property
            # that carries the file name (e.g. quarkus.redis.username).
            - name: QUARKUS_REST_CLIENT_ENVGENE_INVENTORY_SERVICE_URL
              value: "http://{{ .Values.colly.envgeneInventoryService.serviceName }}:8080"
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_CRON_SCHEDULE
              value: {{ .Values.colly.environmentOperationalService.cronSchedule }}
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: {{ .Values.colly.environmentOperationalService.idp.url }}
            - name: QUARKUS_OIDC_TLS_VERIFICATION
              value: none
            {{- range $key, $value := .Values.colly.environmentOperationalService.sdPatterns }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_SD_{{ $key | upper }}_PATTERN
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.colly.environmentOperationalService.monitoring }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_MONITORING_{{ .key | upper | replace "-" "_" }}_NAME
              value: {{ .name | quote }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_MONITORING_{{ .key | upper | replace "-" "_" }}_QUERY
              value: {{ .query | quote }}
            {{- end }}
          image: {{ .Values.colly.environmentOperationalService.image }}
          imagePullPolicy: Always
          name: qubership-colly
          ports:
            - containerPort: {{ .Values.colly.environmentOperationalService.ports.http }}
              name: web
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.colly.environmentOperationalService.ports.http }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.colly.environmentOperationalService.ports.http }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # File mounts instead of secretKeyRef env (BASS Authenticators Handling
          # Guide, req #4). No `subPath` — so kubelet keeps propagating secret
          # rotation to the files (req #8). Each file is named after the config
          # property it provides; the app's secret-files config source maps file
          # name -> property value.
          volumeMounts:
            - name: app-secret
              mountPath: /etc/secrets/pod-secrets/app
              readOnly: true
            - name: app-client-credentials
              mountPath: /etc/secrets/pod-secrets/oidc
              readOnly: true
      volumes:
        - name: app-secret
          secret:
            secretName: {{ .Values.colly.environmentOperationalService.serviceName }}-secret
            items:
              - key: username
                path: quarkus.redis.username
              - key: password
                path: quarkus.redis.password
        - name: app-client-credentials
          secret:
            secretName: {{ .Values.colly.environmentOperationalService.serviceName }}-client-credentials
            items:
              - key: username
                path: quarkus.oidc.client-id
              - key: password
                path: quarkus.oidc.credentials.secret
