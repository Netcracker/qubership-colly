---
{{- if not (or (eq .Values.M2M_AUTH_MODE "legacy") (eq .Values.M2M_AUTH_MODE "hybrid") (eq .Values.M2M_AUTH_MODE "k8s")) }}
{{- fail "M2M_AUTH_MODE must be 'legacy', 'hybrid' or 'k8s' (got: " .Values.M2M_AUTH_MODE ")" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: {{ .Values.colly.environmentOperationalService.serviceName }}
    app.kubernetes.io/name: {{ .Values.colly.environmentOperationalService.serviceName }}
    app.kubernetes.io/instance: {{ printf "%s-%s" .Values.colly.environmentOperationalService.serviceName .Values.NAMESPACE }}
    app.kubernetes.io/version: {{ .Chart.Version }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: qubership-colly
    app.kubernetes.io/managed-by: {{ .Values.MANAGED_BY }}
    app.kubernetes.io/technology: java
  name: {{ .Values.colly.environmentOperationalService.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: {{ .Values.colly.environmentOperationalService.serviceName }}
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.27.2
      labels:
        name: {{ .Values.colly.environmentOperationalService.serviceName }}
        app.kubernetes.io/name: {{ .Values.colly.environmentOperationalService.serviceName }}
        app.kubernetes.io/instance: {{ printf "%s-%s" .Values.colly.environmentOperationalService.serviceName .Values.NAMESPACE }}
        app.kubernetes.io/version: {{ .Chart.Version }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: qubership-colly
        app.kubernetes.io/technology: java
    spec:
      serviceAccountName: {{ .Values.colly.environmentOperationalService.serviceName }}
      {{- if or (eq .Values.M2M_AUTH_MODE "hybrid") (eq .Values.M2M_AUTH_MODE "k8s") }}
      # Projected SA tokens + topology ConfigMap (PDPLDEVOPS-25309). Mirrors
      # coretpl.volumes.default (core-helm-library >= 2.1.0), inlined because
      # this chart has no coretpl dependency. Renders nothing in legacy mode.
      volumes:
        - name: topology
          configMap:
            name: topology
        - name: projected-netcracker-token
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken:
                  path: token
                  audience: netcracker
                  expirationSeconds: {{ default 3600 .Values.KUBERNETES_M2M_EXPIRATION_SECONDS }}
        - name: projected-dbaas-token
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken:
                  path: token
                  audience: dbaas
                  expirationSeconds: {{ default 3600 .Values.KUBERNETES_M2M_EXPIRATION_SECONDS }}
        - name: projected-maas-token
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken:
                  path: token
                  audience: maas
                  expirationSeconds: {{ default 3600 .Values.KUBERNETES_M2M_EXPIRATION_SECONDS }}
      {{- end }}
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_REDIS_HOSTS
              value: {{ .Values.colly.environmentOperationalService.redis.hosts }}
            - name: QUARKUS_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ .Values.colly.environmentOperationalService.serviceName }}-secret
            - name: QUARKUS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.colly.environmentOperationalService.serviceName }}-secret
            - name: QUARKUS_REST_CLIENT_ENVGENE_INVENTORY_SERVICE_URL
              value: "http://{{ .Values.colly.envgeneInventoryService.serviceName }}:8080"
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_CRON_SCHEDULE
              value: {{ .Values.colly.environmentOperationalService.cronSchedule }}
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: {{ .Values.colly.environmentOperationalService.idp.url }}
            - name: QUARKUS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: name
                  name: {{ .Values.colly.environmentOperationalService.serviceName }}-client-credentials
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.colly.environmentOperationalService.serviceName }}-client-credentials
            - name: QUARKUS_OIDC_TLS_VERIFICATION
              value: none
            - name: M2M_AUTH_MODE
              value: {{ .Values.M2M_AUTH_MODE | quote }}
            {{- range $key, $value := .Values.colly.environmentOperationalService.sdPatterns }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_SD_{{ $key | upper }}_PATTERN
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.colly.environmentOperationalService.monitoring }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_MONITORING_{{ .key | upper | replace "-" "_" }}_NAME
              value: {{ .name | quote }}
            - name: COLLY_ENVIRONMENT_OPERATIONAL_SERVICE_MONITORING_{{ .key | upper | replace "-" "_" }}_QUERY
              value: {{ .query | quote }}
            {{- end }}
          image: {{ .Values.colly.environmentOperationalService.image }}
          imagePullPolicy: Always
          name: qubership-colly
          ports:
            - containerPort: {{ .Values.colly.environmentOperationalService.ports.http }}
              name: web
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.colly.environmentOperationalService.ports.http }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.colly.environmentOperationalService.ports.http }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if or (eq .Values.M2M_AUTH_MODE "hybrid") (eq .Values.M2M_AUTH_MODE "k8s") }}
          # Mirror of coretpl.volumeMounts.default; renders nothing in legacy mode.
          volumeMounts:
            - name: topology
              mountPath: /etc/topology
              readOnly: true
            - name: projected-netcracker-token
              mountPath: /var/run/secrets/tokens/netcracker
              readOnly: true
            - name: projected-dbaas-token
              mountPath: /var/run/secrets/tokens/dbaas
              readOnly: true
            - name: projected-maas-token
              mountPath: /var/run/secrets/tokens/maas
              readOnly: true
          {{- end }}
