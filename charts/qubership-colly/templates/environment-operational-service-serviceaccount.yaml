---
# ServiceAccount for Kubernetes M2M tokens (PDPLDEVOPS-25309).
# The name must match the service name — the identity inside the projected
# token (system:serviceaccount:<ns>:<name>) is what the caller's audience
# token carries and the receiving side checks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.colly.environmentOperationalService.serviceName }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    name: {{ .Values.colly.environmentOperationalService.serviceName }}
    app.kubernetes.io/part-of: qubership-colly
    app.kubernetes.io/managed-by: {{ .Values.MANAGED_BY }}
